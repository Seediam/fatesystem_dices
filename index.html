<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolador d20 Nativo</title>
  <style>
    :root {
      --fundo: #1f1f1f;
      --painel: #2b2b2b;
      --texto: #f0f0f0;
      --muted: #9a9a9a;
      --amarelo: #f0b90b;
      --forca: #ff3b3b;
      --magia: #3f7dff;
      --agilidade: #b14dff;
      --sorte: #33cc66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    h2 {
      margin: 0 0 10px;
      text-align: center;
      letter-spacing: 1px;
      font-size: 19px;
      text-transform: uppercase;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .atributo {
      background: var(--painel);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 6px solid transparent;
    }

    .forca { border-color: var(--forca); }
    .magia { border-color: var(--magia); }
    .agilidade { border-color: var(--agilidade); }
    .sorte { border-color: var(--sorte); }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .titulo { font-weight: 700; font-size: 14px; }
    .contador { min-width: 30px; text-align: center; font-size: 18px; font-weight: 700; }
    .botoes { display: flex; gap: 6px; }

    .btn-ajuste {
      border: none;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      line-height: 30px;
    }

    .btn-ajuste:disabled { opacity: 0.4; cursor: not-allowed; }
    .forca .btn-ajuste { background: #b82323; }
    .magia .btn-ajuste { background: #2352b8; }
    .agilidade .btn-ajuste { background: #7f2ab3; }
    .sorte .btn-ajuste { background: #25994c; }

    .resumo { margin-top: 8px; text-align: center; color: var(--muted); font-size: 12px; }

    #btn-rolar {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--amarelo);
      color: #111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
    }

    #status-texto {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      word-break: break-word;
      min-height: 34px;
    }

    #dice-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    #dice-popup.visible { display: flex; }

    .popup-card {
      width: min(460px, 95vw);
      background: #111822;
      border: 1px solid #2e3a4e;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .popup-title { margin: 0 0 8px; font-size: 16px; text-transform: uppercase; }
    .popup-sub { margin: 0 0 12px; color: #9fb2d1; font-size: 12px; }
    .popup-list { display: grid; gap: 8px; }

    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a2433;
      border-radius: 8px;
      padding: 8px 10px;
      border-left: 4px solid #888;
    }

    .popup-row.forca { border-left-color: var(--forca); }
    .popup-row.magia { border-left-color: var(--magia); }
    .popup-row.agilidade { border-left-color: var(--agilidade); }
    .popup-row.sorte { border-left-color: var(--sorte); }

    .popup-values { font-weight: 700; }
    .popup-total { margin-top: 12px; font-weight: 800; text-align: right; }
    .popup-close {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #2f7bff;
      color: #fff;
      font-weight: 700;
      padding: 9px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Rolador d20 Nativo</h2>
  <div class="hint">Sem extensão externa: rola aqui, mostra popup e sincroniza com os jogadores via broadcast.</div>

  <div class="atributo forca" data-attr="forca">
    <div class="row">
      <span class="titulo">Força (Vermelho)</span>
      <div class="botoes">
        <button type="button" class="btn-ajuste" data-action="decrement">−</button>
        <span class="contador" id="count-forca">0</span>
        <button type="button" class="btn-ajuste" data-action="increment">+</button>
      </div>
    </div>
  </div>

  <div class="atributo magia" data-attr="magia">
    <div class="row">
      <span class="titulo">Magia (Azul)</span>
      <div class="botoes">
        <button type="button" class="btn-ajuste" data-action="decrement">−</button>
        <span class="contador" id="count-magia">0</span>
        <button type="button" class="btn-ajuste" data-action="increment">+</button>
      </div>
    </div>
  </div>

  <div class="atributo agilidade" data-attr="agilidade">
    <div class="row">
      <span class="titulo">Agilidade (Roxa)</span>
      <div class="botoes">
        <button type="button" class="btn-ajuste" data-action="decrement">−</button>
        <span class="contador" id="count-agilidade">0</span>
        <button type="button" class="btn-ajuste" data-action="increment">+</button>
      </div>
    </div>
  </div>

  <div class="atributo sorte" data-attr="sorte">
    <div class="row">
      <span class="titulo">Sorte (Verde)</span>
      <div class="botoes">
        <button type="button" class="btn-ajuste" data-action="decrement">−</button>
        <span class="contador" id="count-sorte">0</span>
        <button type="button" class="btn-ajuste" data-action="increment">+</button>
      </div>
    </div>
  </div>

  <div class="resumo" id="resumo-dados">Total de dados: 0</div>
  <button type="button" id="btn-rolar">Rolar dados</button>
  <div id="status-texto">Aguardando seleção...</div>

  <div id="dice-popup" aria-hidden="true">
    <div class="popup-card">
      <h3 class="popup-title">Resultado da rolagem</h3>
      <p class="popup-sub" id="popup-sub"></p>
      <div class="popup-list" id="popup-list"></div>
      <div class="popup-total" id="popup-total"></div>
      <button type="button" class="popup-close" id="popup-close">Fechar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/lib/index.umd.js"></script>
  <script src="./script.js"></script>
</body>
</html>
